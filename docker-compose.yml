version: '3.8'

services:
  web:
    build: .
    container_name: vlad_site_web
    ports:
      - "80:80"
    volumes:
      - ./public_html:/var/www/html/public_html
    depends_on:
      - db
    networks:
      - vlad_network

  db:
    image: mysql:8.0
    container_name: vlad_site_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: vlad_site
      MYSQL_USER: vlad_user
      MYSQL_PASSWORD: vlad_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - vlad_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: vlad_site_phpmyadmin
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - vlad_network

networks:
  vlad_network:
    driver: bridge

volumes:
  db_data: